[package]
name = "my-pc-kit"
version = "1.2.0"
description = "My PC Kit — Windows system manager"
authors = ["Isado (Nguyễn Thiện Đức)"]
edition = "2021"

[lib]
name = "pc_toolkit_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [".", "crates/pctoolkit-core", "crates/pctoolkit-platform"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pctoolkit-core = { path = "crates/pctoolkit-core" }
pctoolkit-platform = { path = "crates/pctoolkit-platform" }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-updater = "2.11.0"
