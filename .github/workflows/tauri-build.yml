name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'VERSION'
      - 'scripts/sync-version.mjs'
      - 'scripts/sync-version.sh'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Faster CI release compile (still ships a usable EXE; skip fat LTO).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_STRIP: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version comes from package.json "packageManager" (do not set version here).
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-tauri-v2
          cache-workspace-crates: "true"
          cache-on-failure: "true"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check VERSION sync
        run: node ./scripts/sync-version.mjs check

      - name: Prepare updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Warning "Secret TAURI_SIGNING_PRIVATE_KEY is not set. Building unsigned package."
            exit 0
          }
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim().Replace("`r", "")
          $path = Join-Path $env:RUNNER_TEMP "pctoolkit.key"
          [System.IO.File]::WriteAllText($path, $key)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PATH=$path" -Encoding utf8NoBOM

      - name: Build Tauri app (NSIS only)
        shell: pwsh
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PATH -and (Test-Path $env:TAURI_SIGNING_PRIVATE_KEY_PATH)) {
            $env:TAURI_SIGNING_PRIVATE_KEY = [System.IO.File]::ReadAllText($env:TAURI_SIGNING_PRIVATE_KEY_PATH).Trim()
          }
          pnpm tauri build --bundles nsis

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          foreach ($name in @('PCToolkitPro.exe', 'pc-toolkit-pro.exe')) {
            $path = "src-tauri/target/release/$name"
            if (Test-Path $path) {
              Get-Item $path | Select-Object FullName, Length
            }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: my-pc-kit-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/MyPCKit.exe
            src-tauri/target/release/PCToolkitPro.exe
            src-tauri/target/release/pc-toolkit-pro.exe
          if-no-files-found: warn
          retention-days: 14
